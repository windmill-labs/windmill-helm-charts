{{- if .Values.windmill.operator.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: windmill-operator
  labels:
    app: windmill-operator
    app.kubernetes.io/name: windmill-operator
    chart: {{ template "windmill.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  {{- if not (dig "autoscaling" "enabled" false (.Values.windmill.operator | default dict)) }}
  replicas: {{ .Values.windmill.operator.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: windmill-operator
  template:
    metadata:
      labels:
        app: windmill-operator
        app.kubernetes.io/name: windmill-operator
        container: windmill-operator
{{- with .Values.windmill.operator.labels }}
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.windmill.operator.annotations }}
      annotations:
{{ toYaml . | indent 8 }}
  {{- end }}
    spec:
      serviceAccountName: {{ template "windmill.serviceAccountName" . }}
      {{- with include "windmill.podDns" (dict "root" $ "component" "operator" "dnsPolicy" .Values.windmill.operator.dnsPolicy "dnsConfig" .Values.windmill.operator.dnsConfig) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{ if .Values.windmill.imagePullSecrets }}
      imagePullSecrets:
      - name: {{ .Values.windmill.imagePullSecrets }}
      {{ end }}
      containers:
      {{- with .Values.windmill.operator.extraContainers }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      - name: windmill-operator
      {{- with .Values.windmill.operator.containerSecurityContext }}
        securityContext:
        {{- toYaml . | nindent 10 }}
      {{- end }}
        {{ if .Values.enterprise.enabled }}
        image: {{ default "ghcr.io/windmill-labs/windmill-ee" .Values.windmill.image }}:{{ default .Chart.AppVersion .Values.windmill.tag }}
        {{ else }}
        image: {{ default "ghcr.io/windmill-labs/windmill" .Values.windmill.image }}:{{ default .Chart.AppVersion .Values.windmill.tag }}
        {{ end }}
        imagePullPolicy: {{ default "Always" $.Values.windmill.imagePullPolicy }}
        command: ["windmill", "operator"]
        {{ if or .Values.windmill.operator.volumeMounts .Values.windmill.databaseUrlAsFile }}
        volumeMounts:
        {{- with .Values.windmill.operator.volumeMounts }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
        {{- include "windmill.databaseUrlVolumeMount" (dict "root" $) | nindent 8 }}
        {{ end }}
        env:
        {{- with .Values.windmill.operator.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "windmill.databaseUrlEnv" (dict "root" $) | nindent 8 }}
        - name: "RUST_LOG"
          value: "{{ .Values.windmill.rustLog }}"
        - name: "JSON_FMT"
          value: "true"
        resources:
{{ toYaml .Values.windmill.operator.resources | indent 12 }}
    {{ if or .Values.windmill.operator.volumes .Values.windmill.databaseUrlAsFile }}
      volumes:
      {{- with .Values.windmill.operator.volumes }}
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- include "windmill.databaseUrlVolume" (dict "root" $) | nindent 8 }}
    {{ end }}
    {{- with .Values.windmill.operator.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.windmill.operator.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.windmill.operator.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.windmill.operator.podSecurityContext }}
      securityContext:
{{ toYaml . | indent 8 }}
    {{- end }}
{{- end -}}
