{{- if and .Values.enterprise.enabled .Values.windmill.indexer.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: windmill-indexer
  labels:
    app: windmill-indexer
    app.kubernetes.io/name: windmill-indexer
    chart: {{ template "windmill.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  {{- if not (dig "autoscaling" "enabled" false (.Values.windmill.indexer | default dict)) }}
  replicas: 1
  {{- end }}
  revisionHistoryLimit: 3
  # A surged pod is required, not incidental: the incoming pod is what signals the
  # outgoing one to hand over the index write lock, and the outgoing one keeps serving
  # searches read-only until the new pod is ready. Recreate breaks both halves and
  # takes search down for the whole restart, including the index load from object storage.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # The handoff also has to wait out the outgoing pod's in-flight index refresh and
  # merge flush, which can exceed the 600s default and get a healthy rollout reported
  # as ProgressDeadlineExceeded.
  progressDeadlineSeconds: {{ .Values.windmill.indexer.progressDeadlineSeconds | default 1800 }}
  selector:
    matchLabels:
      app: windmill-indexer
  template:
    metadata:
      labels:
        app: windmill-indexer
        app.kubernetes.io/name: windmill-indexer
        container: windmill-indexer
{{- with .Values.windmill.indexer.labels }}
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.windmill.indexer.annotations }}
      annotations:
{{ toYaml . | indent 8 }}
  {{- end }}
    spec:
      serviceAccountName: {{ template "windmill.serviceAccountName" . }}
      {{- with include "windmill.podDns" (dict "root" $ "component" "indexer" "dnsPolicy" .Values.windmill.indexer.dnsPolicy "dnsConfig" .Values.windmill.indexer.dnsConfig) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{ if .Values.windmill.imagePullSecrets }}
      imagePullSecrets:
      - name: {{ .Values.windmill.imagePullSecrets }}
      {{ end }}
      {{- if .Values.windmill.indexer.initContainers }}
      initContainers:
      {{- toYaml .Values.windmill.indexer.initContainers | nindent 6 }}
      {{- end }}
      containers:
      {{- with .Values.windmill.indexer.extraContainers }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      - name: windmill-indexer
      {{- with .Values.windmill.indexer.containerSecurityContext }}
        securityContext:
        {{- toYaml . | nindent 10 }}
      {{- end }}
        image: {{ default "ghcr.io/windmill-labs/windmill-ee" .Values.windmill.image }}:{{ default .Chart.AppVersion .Values.windmill.tag }}
        imagePullPolicy: {{ default "Always" $.Values.windmill.imagePullPolicy }}
        {{ if or .Values.windmill.indexer.volumeMounts .Values.windmill.databaseUrlAsFile }}
        volumeMounts:
        {{- with .Values.windmill.indexer.volumeMounts }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
        {{- include "windmill.databaseUrlVolumeMount" (dict "root" $) | nindent 8 }}
        {{ end }}
        ports:
        - containerPort: 8000
        # The indexer loads its index from object storage before it serves HTTP, so the
        # liveness probe has to stay off until that finishes or a large index restarts the
        # pod forever. Same wait progressDeadlineSeconds covers, so it tracks that budget.
        startupProbe:
          httpGet:
            scheme: HTTP
            path: /api/version
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: {{ max 1 (div (.Values.windmill.indexer.progressDeadlineSeconds | default 1800) 10) }}
        readinessProbe:
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 1
          httpGet:
            scheme: HTTP
            path: /
            httpHeaders:
            - name: Host
              value: localhost
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            scheme: HTTP
            path: /api/version
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        env:
        {{- with .Values.windmill.indexer.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{ if .Values.enterprise.enabled }}
        - name : "METRICS_ADDR"
          value: "{{ .Values.enterprise.metricsAddr }}"
        {{ end }}
        {{- include "windmill.databaseUrlEnv" (dict "root" $) | nindent 8 }}
        - name: "BASE_URL"
          value: "{{ .Values.windmill.baseProtocol }}://{{ .Values.windmill.baseDomain }}"
        - name: "RUST_LOG"
          value: "{{ .Values.windmill.rustLog }}"
        - name: "MODE"
          value: "indexer"
        - name: "JSON_FMT"
          value: "true"
        {{ if .Values.windmill.instanceEventsWebhook }}
        - name: "INSTANCE_EVENTS_WEBHOOK"
          value: "true"
        {{ end }}
        {{ if .Values.enterprise.enabled }}
        {{ if .Values.enterprise.licenseKeySecretName }}
        - name: "LICENSE_KEY"
          valueFrom:
            secretKeyRef:
              name: {{ .Values.enterprise.licenseKeySecretName }}
              key: {{ .Values.enterprise.licenseKeySecretKey }}
        {{ else }}
        - name: "LICENSE_KEY"
          value: "{{ .Values.enterprise.licenseKey }}"
        {{ end }}
        {{ if .Values.enterprise.samlMetadata }}
        - name: "SAML_METADATA"
          value: "{{ .Values.enterprise.samlMetadata }}"
        {{ end }}
        {{ if $.Values.enterprise.enabledS3DistributedCache }}
        - name: "S3_CACHE_BUCKET"
          value: "{{ $.Values.enterprise.s3CacheBucket }}"
        {{ end }}
        {{ end }}
        resources:
{{ toYaml .Values.windmill.indexer.resources | indent 12 }}
    {{ if or .Values.windmill.indexer.volumes .Values.windmill.databaseUrlAsFile }}
      volumes:
      {{- with .Values.windmill.indexer.volumes }}
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- include "windmill.databaseUrlVolume" (dict "root" $) | nindent 8 }}
    {{ end }}
    {{- with .Values.windmill.indexer.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.windmill.indexer.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.windmill.indexer.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.windmill.indexer.podSecurityContext }}
      securityContext:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.windmill.indexer.securityContext }}
      securityContext:
{{ toYaml . | indent 8 }}
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: windmill-indexer
spec:
  ports:
    - port: 8000
      protocol: TCP
      targetPort: 8000
  selector:
    app.kubernetes.io/name: windmill-indexer
  sessionAffinity: ClientIP
  type: ClusterIP
{{- end -}}
