# Installs with the server pods and every worker group on service accounts of their own,
# under workerGroupsRequireServiceAccount. Every other ci values file runs everything as
# the chart's main service account, so without this one a pod naming an account that the
# render gets wrong, or a worker that cannot start without its API token, still installs
# green.
windmill:
  workerGroupsRequireServiceAccount: true
  app:
    serviceAccountName: windmill-server
  indexer:
    serviceAccountName: windmill-server
  workerGroups:
    - name: "default"
      replicas: 1
      serviceAccountName: windmill-worker
      automountServiceAccountToken: false
    - name: "native"
      replicas: 1
      serviceAccountName: windmill-worker
      automountServiceAccountToken: false
      extraEnv:
        - name: "NATIVE_MODE"
          value: "true"
        - name: "SLEEP_QUEUE"
          value: "200"
extraDeploy:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: windmill-server
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: windmill-worker
    automountServiceAccountToken: false
