# Generated by ../build.sh. Azure Marketplace requires every image to be declared under
# global.azure.images; the marketplace rewrites `registry` to its own registry at publish time.
global:
  azure:
    images:
      windmill:
        registry: windmillmarketplace.azurecr.io
        image: windmill-ee
        digest: __DIGEST_WINDMILL__
      windmillExtra:
        registry: windmillmarketplace.azurecr.io
        image: windmill-extra
        digest: __DIGEST_EXTRA__
      postgres:
        registry: windmillmarketplace.azurecr.io
        image: postgres
        digest: __DIGEST_POSTGRES__

windmill:
  enterprise:
    enabled: true
    # Left empty on purpose: the licence key is entered in Instance settings after install.
    licenseKey: ""
  # Bundled PostgreSQL is for evaluation only; production installs point databaseUrl at
  # Azure Database for PostgreSQL and set postgresql.enabled=false.
  postgresql:
    enabled: true
  ingress:
    enabled: false
  windmill:
    baseDomain: windmill
    baseProtocol: http
